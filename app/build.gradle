plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.appdistribution'
}

// 從 .env 載入變數（優先於系統環境變數）
def localProps = new Properties()
def envFile = rootProject.file('.env')
if (envFile.exists()) {
    envFile.withReader('UTF-8') { reader ->
        reader.eachLine { line ->
            line = line.trim()
            if (line && !line.startsWith('#') && line.contains('=')) {
                def idx = line.indexOf('=')
                def key = line.substring(0, idx).trim()
                def val_ = line.substring(idx + 1).trim()
                // 去掉引號
                if ((val_.startsWith('"') && val_.endsWith('"')) || (val_.startsWith("'") && val_.endsWith("'"))) {
                    val_ = val_.substring(1, val_.length() - 1)
                }
                localProps.setProperty(key, val_)
            }
        }
    }
}

android {
    namespace 'com.snowrealm.yukiboard'
    compileSdk 35

    defaultConfig {
        applicationId "com.snowrealm.yukiboard"
        minSdk 26
        targetSdk 34
        versionCode 166
        versionName "0.11.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // libchewing JNI ABI filter (arm64 優先，預留 x86_64 供模擬器)
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }

        // Claw AI 設定
        buildConfigField "String", "INVITE_HMAC_SECRET", "\"${localProps.getProperty('INVITE_HMAC_SECRET', System.getenv('INVITE_HMAC_SECRET') ?: 'yukiboard_dev_2026')}\""
        buildConfigField "String", "PLATFORM_API_KEY", "\"${localProps.getProperty('PLATFORM_API_KEY', System.getenv('PLATFORM_API_KEY') ?: '')}\""
        // Insight Engine 貼圖 + GIF API
        buildConfigField "String", "INSIGHT_API_BASE_URL", "\"${localProps.getProperty('INSIGHT_API_BASE_URL', System.getenv('INSIGHT_API_BASE_URL') ?: 'https://insight.snowrealm.pet')}\""
        buildConfigField "String", "GIPHY_API_KEY", "\"${localProps.getProperty('GIPHY_API_KEY', System.getenv('GIPHY_API_KEY') ?: '')}\""
        // AI Provider Keys（開發用，正式版由使用者自行輸入）
        buildConfigField "String", "OPENAI_API_KEY", "\"${localProps.getProperty('OPENAI_API_KEY', System.getenv('OPENAI_API_KEY') ?: '')}\""
        buildConfigField "String", "ANTHROPIC_API_KEY", "\"${localProps.getProperty('ANTHROPIC_API_KEY', System.getenv('ANTHROPIC_API_KEY') ?: '')}\""
        // OpenWeatherMap
        buildConfigField "String", "OPENWEATHER_API_KEY", "\"${localProps.getProperty('OPENWEATHER_API_KEY', System.getenv('OPENWEATHER_API_KEY') ?: '')}\""
        // Supabase（Z幣 + 皮膚商城 + 排行榜）
        buildConfigField "String", "YUKIBOARD_SUPABASE_URL", "\"${localProps.getProperty('YUKIBOARD_SUPABASE_URL', System.getenv('YUKIBOARD_SUPABASE_URL') ?: '')}\""
        buildConfigField "String", "YUKIBOARD_SUPABASE_ANON_KEY", "\"${localProps.getProperty('YUKIBOARD_SUPABASE_ANON_KEY', System.getenv('YUKIBOARD_SUPABASE_ANON_KEY') ?: '')}\""
        // 藍新金流（Z幣儲值）
        buildConfigField "String", "NEWEBPAY_MERCHANT_ID", "\"${localProps.getProperty('NEWEBPAY_MERCHANT_ID', System.getenv('NEWEBPAY_MERCHANT_ID') ?: '')}\""
        buildConfigField "String", "NEWEBPAY_HASH_KEY", "\"${localProps.getProperty('NEWEBPAY_HASH_KEY', System.getenv('NEWEBPAY_HASH_KEY') ?: '')}\""
        buildConfigField "String", "NEWEBPAY_HASH_IV", "\"${localProps.getProperty('NEWEBPAY_HASH_IV', System.getenv('NEWEBPAY_HASH_IV') ?: '')}\""
    }

    signingConfigs {
        release {
            storeFile file("${rootProject.projectDir}/keystore/yukiboard-release.jks")
            storePassword localProps.getProperty('KEYSTORE_PASSWORD', System.getenv('KEYSTORE_PASSWORD') ?: 'yukiboard2026')
            keyAlias localProps.getProperty('KEY_ALIAS', System.getenv('KEY_ALIAS') ?: 'yukiboard')
            keyPassword localProps.getProperty('KEY_PASSWORD', System.getenv('KEY_PASSWORD') ?: 'yukiboard2026')
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            firebaseAppDistribution {
                groups = "testers"
                releaseNotes = "v${android.defaultConfig.versionName}\n" +
                    "- Sprint 12 fix: ImeServiceLifecycle 重複 null 判斷清理，warning 移除且不改 runtime 行為\n" +
                    "- Sprint 13-0: 補齊 API Key 雲同步隱私條文，與實際加密儲存 / 還原流程對齊\n" +
                    "- Sprint 13-0: 修正設定頁登入後仍回到藍色登入按鈕的狀態判斷，已登入時不再錯回未登入 UI\n" +
                    "- Sprint 13-1: network_security_config 文件化收斂，明確標示 production HTTPS baseline、debug user CA 與 loopback cleartext 邊界\n" +
                    "- Gate docs: 補建 Sprint12 gate fix、更新 Sprint13 / Sprint14 round gate、完成段落改為整段刪除線\n" +
                    "- 已知進行中：S13-2 Fraud Report Privacy 尚未結案，本版未包含其 runtime 變更"
            }
        }
        debug {
            minifyEnabled false
            debuggable true
            firebaseAppDistribution {
                groups = "testers"
                releaseNotes = "v${android.defaultConfig.versionName}\n" +
                    "- Sprint 12 fix: ImeServiceLifecycle 重複 null 判斷清理，warning 移除且不改 runtime 行為\n" +
                    "- Sprint 13-0: 補齊 API Key 雲同步隱私條文，與實際加密儲存 / 還原流程對齊\n" +
                    "- Sprint 13-0: 修正設定頁登入後仍回到藍色登入按鈕的狀態判斷，已登入時不再錯回未登入 UI\n" +
                    "- Sprint 13-1: network_security_config 文件化收斂，明確標示 production HTTPS baseline、debug user CA 與 loopback cleartext 邊界\n" +
                    "- Gate docs: 補建 Sprint12 gate fix、更新 Sprint13 / Sprint14 round gate、完成段落改為整段刪除線\n" +
                    "- 已知進行中：S13-2 Fraud Report Privacy 尚未結案，本版未包含其 runtime 變更"
            }
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    // OpenGL ES shader assets
    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
        }
    }
}

// RIME 詞庫轉換 task：build 前用 Python 腳本轉換 RIME → SQLite
tasks.register('convertRimeDict') {
    def scriptFile = rootProject.file('scripts/convert_rime_dict.py')
    def dictsDir = rootProject.file('scripts/dicts')
    def outputDb = file('src/main/assets/rime_bopomofo.db')

    // 只在 scripts/dicts/ 有 .yaml 檔案時執行
    onlyIf {
        scriptFile.exists() && dictsDir.exists() &&
            dictsDir.listFiles()?.any { it.name.endsWith('.yaml') }
    }

    if (dictsDir.exists()) {
        inputs.dir(dictsDir)
    }
    outputs.file(outputDb)

    doLast {
        exec {
            commandLine 'python3', scriptFile.absolutePath,
                '--local-dir', dictsDir.absolutePath
        }
        // 搬移產出的 DB 到 assets
        def generatedDb = rootProject.file('rime_bopomofo.db')
        if (generatedDb.exists() && generatedDb.absolutePath != outputDb.absolutePath) {
            generatedDb.renameTo(outputDb)
        }
    }
}
// convertRimeDict 改為手動執行（./gradlew convertRimeDict）
// 自動依賴會造成 lint/build implicit dependency 問題

dependencies {
    // AndroidX Core
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Lifecycle / ViewModel
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.0'

    // Lottie 角色動畫
    implementation 'com.airbnb.android:lottie:6.3.0'

    // Chrome Custom Tab（OAuth 登入用）
    implementation 'androidx.browser:browser:1.7.0'

    // Claw AI — 安全儲存
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // Claw AI — HTTP 客戶端
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // Claw AI — JSON 序列化
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3'

    // 定位（天氣面板用）
    implementation 'com.google.android.gms:play-services-location:21.1.0'

    // MLKit 翻譯（離線模型）
    implementation 'com.google.mlkit:translate:17.0.3'

    // MLKit Digital Ink Recognition（手寫辨識）
    implementation 'com.google.mlkit:digital-ink-recognition:18.1.0'

    // TFLite（防詐本地模型推論）
    implementation 'org.tensorflow:tensorflow-lite:2.14.0'

    // Filament 3D 渲染（VRM 角色）
    implementation 'com.google.android.filament:filament-android:1.51.6'
    implementation 'com.google.android.filament:filament-utils-android:1.51.6'
    implementation 'com.google.android.filament:gltfio-android:1.51.6'

    // OpenGL ES — 由系統提供，無需額外依賴

    // Firebase
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-analytics'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'androidx.test:core:1.5.0'
    testImplementation 'org.robolectric:robolectric:4.13'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
